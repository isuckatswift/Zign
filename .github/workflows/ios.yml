
name: Zign iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - experiment/swift-certificates-cms
    paths:
      - "Sources/**"
      - "Tests/**"
      - "project.yml"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Zign
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Find available iPhone simulator
        id: simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')

          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator was found."
            exit 1
          fi

          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIMULATOR_ID"

      - name: Build Zign for iPhone Simulator
        run: |
          rm -rf build/DerivedData

          xcodebuild \
            -project Zign.xcodeproj \
            -scheme Zign \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zign-iOS-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/Zign.app
          if-no-files-found: error
          retention-days: 7
