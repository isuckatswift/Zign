
name: Zign iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Sources/**"
      - "project.yml"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Zign
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project Zign.xcodeproj \
            -scheme Zign \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zign-iOS-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/Zign.app
          if-no-files-found: error
          retention-days: 7
