
name: Zign

options:
  bundleIdPrefix: com.isuckatswift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

  swift-certificates:
    url: https://github.com/apple/swift-certificates
    exactVersion: "1.21.1"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Zign
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    PRODUCT_BUNDLE_IDENTIFIER: com.isuckatswift.Zign

targets:
  Zign:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: swift-certificates
        product: X509
    settings:
      base:
        PRODUCT_NAME: Zign
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_PREVIEWS: YES

  ZignTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Zign
      - package: swift-certificates
        product: X509
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isuckatswift.ZignTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Zign.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Zign"
        BUNDLE_LOADER: "$(TEST_HOST)"
